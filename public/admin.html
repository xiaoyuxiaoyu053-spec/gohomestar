<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STAR 管理后台</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px;background:#f3f5f9;color:#202534;font-family:Arial,"Microsoft YaHei",sans-serif}
.card{width:100%;max-width:430px;background:white;padding:30px;border-radius:18px;box-shadow:0 10px 40px #18274412}
.logo{font-size:24px;font-weight:bold;margin-bottom:8px}
.subtitle{color:#7b8496;font-size:14px;margin-bottom:25px}
label{display:block;font-size:14px;margin:16px 0 8px}
input{width:100%;padding:13px;border:1px solid #dce1e9;border-radius:9px;font-size:15px;outline:none}
input:focus{border-color:#526be8}
button{width:100%;padding:13px;margin-top:16px;border:0;border-radius:9px;background:#283b68;color:white;font-size:15px;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.secondary{background:#eef1f7;color:#283b68}
#panel{display:none}
#message{font-size:14px;line-height:1.6;margin-top:15px;overflow-wrap:anywhere}
.note{font-size:12px;color:#7b8496;line-height:1.7;margin-top:15px}
</style>
</head>
<body>
<div class="card">
    <div class="logo">★ STAR</div>
    <div class="subtitle">网站跳转控制中心</div>

    <section id="login">
        <label for="password">管理员密码</label>
        <input id="password" type="password" placeholder="请输入管理员密码"
               maxlength="256" autocomplete="current-password">
        <button id="loginBtn" onclick="login()">登录管理后台</button>
    </section>

    <section id="panel">
        <label for="target">跳转目标网址</label>
        <input id="target" type="url" placeholder="https://example.com" maxlength="2048">
        <button id="saveBtn" onclick="save()">保存跳转设置</button>
        <button class="secondary" onclick="logout()">退出登录</button>
        <div class="note">保存后，访问网站首页的用户将自动跳转到此网址。</div>
    </section>

    <div id="message" role="status"></div>
</div>

<script>
const message = document.getElementById("message");

function showMessage(text, success = false) {
    message.textContent = text;
    message.style.color = success ? "#16834a" : "#d13b45";
}

async function request(url, options = {}) {
    const response = await fetch(url, {
        credentials: "same-origin",
        cache: "no-store",
        ...options,
        headers: {
            "Content-Type": "application/json",
            ...(options.headers || {})
        }
    });
    const data = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(data.message || "请求失败");
    return data;
}

async function login() {
    const button = document.getElementById("loginBtn");
    button.disabled = true;
    try {
        await request("/admin/login", {
            method: "POST",
            body: JSON.stringify({password: document.getElementById("password").value})
        });
        document.getElementById("login").style.display = "none";
        document.getElementById("panel").style.display = "block";
        await loadConfig();
        showMessage("登录成功", true);
    } catch (error) {
        showMessage(error.message);
    } finally {
        button.disabled = false;
    }
}

async function loadConfig() {
    const data = await request("/admin/config");
    document.getElementById("target").value = data.target || "";
}

async function save() {
    const button = document.getElementById("saveBtn");
    button.disabled = true;
    try {
        const data = await request("/admin/config", {
            method: "POST",
            body: JSON.stringify({target: document.getElementById("target").value.trim()})
        });
        showMessage(data.message, true);
    } catch (error) {
        showMessage(error.message);
    } finally {
        button.disabled = false;
    }
}

async function logout() {
    try {
        await request("/admin/logout", {method: "POST"});
        document.getElementById("panel").style.display = "none";
        document.getElementById("login").style.display = "block";
        document.getElementById("password").value = "";
        showMessage("已退出登录", true);
    } catch (error) {
        showMessage(error.message);
    }
}

document.getElementById("password").addEventListener("keydown", event => {
    if (event.key === "Enter") login();
});

(async () => {
    try {
        await loadConfig();
        document.getElementById("login").style.display = "none";
        document.getElementById("panel").style.display = "block";
    } catch (_) {}
})();
</script>
</body>
  </html>
